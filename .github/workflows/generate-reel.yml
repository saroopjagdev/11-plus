name: Generate Reel

on:
  workflow_dispatch:
    inputs:
      template:
        description: "Force a template instead of random 50/50 (vocab|tip)"
        required: false
        type: choice
        options:
          - ""
          - vocab
          - tip
  schedule:
    # GitHub Actions cron uses UTC. Two of these (06:30/16:30) run an hour
    # ahead of each Post Reel run (07:30/17:30 UTC in post-reel.yml) so a
    # freshly generated reel is already sitting in R2 before that workflow
    # picks one. Bumped from 2x/day to 4x/day (temporary — see note below)
    # to grow the new-content share of the pool faster: with ~200 pre-existing
    # Canva-made reels and random (not FIFO) selection in post_reel.py, new
    # reels don't replace old ones on any schedule, they just add to the mix
    # — at 2/day that mix stays under ~10% for weeks, which is slower than
    # wanted given the new template's research-backed content and save-cue
    # card are expected to outperform the old batch (instagram_media_insights
    # showed 0 saves/shares across every post under the old format).
    #
    # TODO: dial back to 2x/day (07:30 UTC once the mix is meaningfully
    # newer content — check instagram_media_insights for reel_key/template
    # coverage, or just eyeball how much of reels/ has a vocab__/tip__
    # prefix) via `list_r2_keys`.
    - cron: "30 1 * * *"
    - cron: "30 6 * * *"
    - cron: "30 11 * * *"
    - cron: "30 16 * * *"

jobs:
  generate-reel:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_REELS_PREFIX: reels/
      R2_MUSIC_PREFIX: music/
      R2_BACKGROUNDS_PREFIX: backgrounds/
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate reel
        run: python scripts/generate_reel.py ${{ inputs.template && format('--template {0}', inputs.template) || '' }}
