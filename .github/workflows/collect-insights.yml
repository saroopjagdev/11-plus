name: Collect Instagram Insights

on:
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Optional: widen the lookback window to N days for a one-off historical backfill"
        required: false
        type: string
  schedule:
    # GitHub Actions cron uses UTC. Once daily — Insights numbers need time
    # to stabilize after posting, so more-frequent collection wouldn't add
    # useful signal, just more (identical-ish) rows.
    - cron: "0 6 * * *"

jobs:
  collect-insights:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GRAPH_API_VERSION: v19.0
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Same Instagram app credentials used elsewhere — needs
      # instagram_manage_insights in addition to whatever's already
      # granted. See README.md's "Insights Setup" section.
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_PAGE_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_PAGE_ACCESS_TOKEN }}
      INSTAGRAM_USER_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_USER_ACCESS_TOKEN }}
      INSTAGRAM_APP_ID: ${{ secrets.INSTAGRAM_APP_ID }}
      INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
      INSTAGRAM_PAGE_ID: ${{ secrets.INSTAGRAM_PAGE_ID }}
      INSTAGRAM_TOKEN_CACHE_PATH: scratch/instagram_tokens.json
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect insights
        run: |
          if [ -n "${{ inputs.backfill_days }}" ]; then
            python scripts/collect_insights.py --backfill-days "${{ inputs.backfill_days }}"
          else
            python scripts/collect_insights.py
          fi
