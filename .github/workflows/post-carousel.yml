name: Post Carousel (Instagram)

on:
  workflow_dispatch:

jobs:
  post-carousel:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FIXED_CAPTION: ${{ secrets.FIXED_CAPTION }}
      GRAPH_API_VERSION: v19.0
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_REELS_PREFIX: reels/
      R2_MUSIC_PREFIX: music/
      # Instagram — own, independent Facebook app. Leave INSTAGRAM_USER_ID
      # unset/empty to skip Instagram posting. Set either
      # INSTAGRAM_PAGE_ACCESS_TOKEN directly, or the
      # INSTAGRAM_USER_ACCESS_TOKEN/APP_ID/APP_SECRET/PAGE_ID group for
      # auto-refresh — see README.md.
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_PAGE_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_PAGE_ACCESS_TOKEN }}
      INSTAGRAM_USER_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_USER_ACCESS_TOKEN }}
      INSTAGRAM_APP_ID: ${{ secrets.INSTAGRAM_APP_ID }}
      INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
      INSTAGRAM_PAGE_ID: ${{ secrets.INSTAGRAM_PAGE_ID }}
      INSTAGRAM_TOKEN_CACHE_PATH: scratch/instagram_tokens.json
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate carousel
        run: python scripts/generate_carousel.py

      - name: Post carousel
        run: python scripts/social_instagram_carousel.py
